{% extends "admin_app/base.html" %}

{% block title %}{{ page_title }} | Trekky Admin{% endblock %}
{% block page_title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-lg-7 col-xl-6">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4 p-lg-5">
        <p class="text-secondary">{{ page_subtitle }}</p>
        <h2 class="h4 mb-3">Are you sure?</h2>
        <div class="alert alert-warning">This action cannot be undone for <strong>{{ object }}</strong>.</div>
        <form method="post">
          {% csrf_token %}
          <div class="d-flex flex-wrap gap-2 mt-4">
            <button type="submit" class="btn btn-danger">Delete</button>
            <a href="{{ cancel_url }}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
