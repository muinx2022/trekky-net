name: Build And Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: docker.io
  API_IMAGE_NAME: trekky-net-api
  WEB_IMAGE_NAME: trekky-net-web
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.API_IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/docker/api.Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.WEB_IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./web/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.trekky.net' }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://trekky.net' }}
            NEXT_PUBLIC_BASE_URL=${{ vars.NEXT_PUBLIC_BASE_URL || 'https://trekky.net' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    needs:
      - build-api
      - build-web
    steps:
      - name: Notify deploy listener
        shell: bash
        run: |
          set -Eeuo pipefail
          payload="$(cat <<'JSON'
          {
            "ref": "${{ github.ref }}",
            "sha": "${{ github.sha }}",
            "services": ["api", "web"]
          }
          JSON
          )"
          curl --fail --show-error --silent \
            -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}" \
            -H "content-type: application/json" \
            -H "x-deploy-token: ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}" \
            --data "$payload"
      - name: Verify public health
        shell: bash
        run: |
          set -Eeuo pipefail
          sleep 20
          curl --fail --show-error --silent --location --max-time 20 https://trekky.net > /dev/null
          admin_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 https://api.trekky.net/admin-app/)"
          if [[ "$admin_status" != "302" ]]; then
            echo "Unexpected admin-app status: $admin_status" >&2
            exit 1
          fi
