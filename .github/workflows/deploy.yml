name: Build And Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: docker.io
  API_IMAGE_NAME: trekky-net-api
  WEB_IMAGE_NAME: trekky-net-web
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.API_IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./deploy/docker/api.Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.WEB_IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: ./web-nuxt
          file: ./web-nuxt/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NUXT_API_URL=${{ vars.NUXT_API_URL || 'https://api.trekky.net' }}
            NUXT_PUBLIC_API_URL=${{ vars.NUXT_PUBLIC_API_URL || 'https://api.trekky.net' }}
            NUXT_PUBLIC_SITE_URL=${{ vars.NUXT_PUBLIC_SITE_URL || 'https://trekky.net' }}
            NUXT_PUBLIC_BASE_URL=${{ vars.NUXT_PUBLIC_BASE_URL || 'https://trekky.net' }}
            NUXT_PUBLIC_GA4_MEASUREMENT_ID=${{ vars.NUXT_PUBLIC_GA4_MEASUREMENT_ID || '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    needs:
      - build-api
      - build-web
    steps:
      - name: Notify deploy listener
        shell: bash
        run: |
          set -Eeuo pipefail
          payload="$(cat <<'JSON'
          {
            "ref": "${{ github.ref }}",
            "sha": "${{ github.sha }}",
            "services": ["api", "web"]
          }
          JSON
          )"
          curl --fail --show-error --silent \
            -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}" \
            -H "content-type: application/json" \
            -H "x-deploy-token: ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}" \
            --data "$payload"
      - name: Verify public health
        shell: bash
        run: |
          set -Eeuo pipefail
          for attempt in {1..12}; do
            site_ok=false
            admin_ok=false

            if curl --fail --show-error --silent --location --max-time 20 https://trekky.net > /dev/null; then
              site_ok=true
            fi

            admin_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 https://api.trekky.net/admin-app/ || true)"
            if [[ "$admin_status" == "302" ]]; then
              admin_ok=true
            fi

            if [[ "$site_ok" == true && "$admin_ok" == true ]]; then
              exit 0
            fi

            echo "Health check attempt $attempt failed: site_ok=$site_ok admin_status=${admin_status:-none}" >&2
            sleep 10
          done

          echo "Public health checks did not stabilize in time." >&2
          exit 1
